57\u305F\u304C\u3001\u4E16\u754C\u7684\u306A\u30A2\u30B3\u30FC\u30B0\u30EB\u30FC\u30D7\u306E\u8CB4\u30DB\u30C6\u30EB\u3067\u3001\u81EA\u5206\u306E\u5F37\u307F\u3092\u6D3B\u304B\u3057\u305F\u3044\u3068\u8003\u3048\u305F\u304B\u3089\u3067\u3059\u3002\u30D5\u30ED\u30F3\u30C8\u306F\u3001\u304A\u5BA2\u69D8\u3068\u6700\u521D\u306B\u63A5\u3059\u308B\u5927\u5207\u306A\u4ED5\u4E8B\u3060\u3068\u601D\u3063\u3066\u3044\u307E\u3059\u3002\u6885\u7530\u306E\u5FD9\u3057\u3044\u30B3\u30F3\u30D3\u30CB\u3067\u3001\u3044\u308D\u3044\u308D\u306A\u304A\u5BA2\u69D8\u306B\u67D4\u8EDF\u306B\u5BFE\u5FDC\u3059\u308B\u529B\u3092\u8EAB\u306B\u3064\u3051\u307E\u3057\u305F\u3002\u3053\u306E\u7D4C\u9A13\u30683\u3064\u306E\u8A00\u8A9E\u3092\u6D3B\u304B\u3057\u3066\u3001\u56FD\u5185\u5916\u306E\u304A\u5BA2\u69D8\u3092\u7B11\u9854\u3067\u304A\u8FCE\u3048\u3057\u305F\u3044\u3067\u3059\u3002",aEn:"As I said in round one: I want to use my strengths at a global Accor hotel. The front desk is the guest's important first point of contact. At a busy Umeda convenience store I learned to respond flexibly to all kinds of customers \u2014 I want to welcome guests from Japan and abroad with a smile."},{q:"\u306A\u305C\u5F53\u30DB\u30C6\u30EB\uFF08\u30A4\u30D3\u30B9\u30D0\u30B8\u30A7\u30C3\u30C8\u5927\u962A\u6885\u7530\uFF09\u3092\u9078\u3093\u3060\u306E\u3067\u3059\u304B\u3002",qEn:"Why this hotel specifically?",a:"\u6885\u7530\u306F\u3001\u30D3\u30B8\u30CD\u30B9\u3084\u89B3\u5149\u3067\u56FD\u5185\u5916\u304B\u3089\u591A\u304F\u306E\u304A\u5BA2\u69D8\u304C\u96C6\u307E\u308B\u5834\u6240\u3067\u3059\u3002\u305D\u306E\u4E2D\u3067\u8CB4\u30DB\u30C6\u30EB\u306F\u3001\u30A4\u30D3\u30B9\u30D0\u30B8\u30A7\u30C3\u30C8\u3068\u3057\u3066\u3001\u5FC5\u8981\u306A\u3082\u306E\u3092\u3057\u3063\u304B\u308A\u5C4A\u3051\u308B\u30B9\u30DE\u30FC\u30C8\u306A\u30B5\u30FC\u30D3\u30B9\u3092\u63D0\u4F9B\u3055\u308C\u3066\u3044\u307E\u3059\u3002\u8A00\u8449\u3060\u3051\u3067\u306A\u304F\u6587\u5316\u306E\u9055\u3044\u3082\u7406\u89E3\u3057\u3066\u5BFE\u5FDC\u3067\u304D\u308B\u79C1\u306E\u529B\u3092\u3001\u4E00\u756A\u6D3B\u304B\u305B\u308B\u74B0\u5883\u3060\u3068\u8003\u3048\u307E\u3057\u305F\u3002",aEn:"Umeda draws guests from everywhere; ibis budget delivers smart, essential service. An environment where understanding culture \u2014 not just language \u2014 matters most is where my skills contribute best."},{q:"\u591C\u52E4\u30B7\u30D5\u30C8\u304C\u3042\u308A\u307E\u3059\u304C\u3001\u554F\u984C\u3042\u308A\u307E\u305B\u3093\u304B\u3002",qEn:"Night shifts \u2014 OK?",a:"\u306F\u3044\u3001\u554F\u984C\u3054\u3056\u3044\u307E\u305B\u3093\u3002\u5B66\u751F\u6642\u4EE3\u304B\u3089\u81EA\u91CD\u30C8\u30EC\u30FC\u30CB\u30F3\u30B0\u3092\u7D9A\u3051\u3066\u304A\u308A\u3001\u4F53\u529B\u3068\u81EA\u5DF1\u7BA1\u7406\u306B\u306F\u81EA\u4FE1\u304C\u3042\u308A\u307E\u3059\u3002\u30B3\u30F3\u30D3\u30CB\u3067\u3082\u591C\u306E\u6642\u9593\u5E2F\u3084\u6DF7\u96D1\u3059\u308B\u6642\u9593\u306E\u30B7\u30D5\u30C8\u3092\u7D4C\u9A13\u3057\u3066\u3044\u307E\u3059\u306E\u3067\u3001\u591C\u52E4\u306B\u3082\u65E9\u304F\u6163\u308C\u3066\u8CA2\u732E\u3067\u304D\u307E\u3059\u3002",aEn:"Yes, no problem. Years of calisthenics training built my stamina and self-management, and I already worked night and rush-hour shifts at the convenience store."},{q:"\u5916\u56FD\u8A9E\u3067\u306E\u63A5\u5BA2\u306B\u62B5\u6297\u306F\u3042\u308A\u307E\u3059\u304B\u3002",qEn:"Comfortable serving in foreign languages?",a:"\u3044\u3044\u3048\u3001\u307E\u3063\u305F\u304F\u62B5\u6297\u306F\u3054\u3056\u3044\u307E\u305B\u3093\u3002\u30BF\u30A4\u8A9E\u306F\u6BCD\u8A9E\u3067\u3001\u82F1\u8A9E\u3082\u6D41\u66A2\u306B\u8A71\u305B\u307E\u3059\u3002\u6587\u5316\u306E\u9055\u3046\u304A\u5BA2\u69D8\u304C\u4F55\u3092\u6C42\u3081\u3066\u3044\u308B\u304B\u306B\u6C17\u3065\u3044\u3066\u3001\u6BCD\u56FD\u8A9E\u3067\u5BFE\u5FDC\u3059\u308B\u3053\u3068\u3067\u3001\u6D77\u5916\u306E\u304A\u5BA2\u69D8\u306B\u5B89\u5FC3\u3057\u3066\u3044\u305F\u3060\u3051\u308B\u3068\u601D\u3063\u3066\u304A\u308A\u307E\u3059\u3002",aEn:"Not at all. Thai is my native language and I speak English fluently. Noticing what guests from other cultures need \u2014 and answering in their language \u2014 puts them at ease."},{q:"\u30DB\u30C6\u30EB\u3067\u306E\u7D4C\u9A13\u306F\u3042\u308A\u307E\u3059\u304B\u3002",qEn:"Any hotel experience?",a:"\u30DB\u30C6\u30EB\u3067\u306E\u52E4\u52D9\u7D4C\u9A13\u306F\u3054\u3056\u3044\u307E\u305B\u3093\u304C\u3001\u6885\u7530\u306E\u5FD9\u3057\u3044\u30B3\u30F3\u30D3\u30CB\u3067\u306E\u63A5\u5BA2\u7D4C\u9A13\u304C\u3054\u3056\u3044\u307E\u3059\u3002\u5916\u56FD\u4EBA\u306E\u304A\u5BA2\u69D8\u3078\u306E\u514D\u7A0E\u306E\u5BFE\u5FDC\u3084\u9053\u6848\u5185\u306A\u3069\u3001\u30DB\u30C6\u30EB\u306E\u4ED5\u4E8B\u306B\u3064\u306A\u304C\u308B\u7D4C\u9A13\u3092\u91CD\u306D\u3066\u304D\u307E\u3057\u305F\u3002\u3053\u306E\u7D4C\u9A13\u3092\u6D3B\u304B\u3057\u3066\u3001\u4E00\u65E5\u3082\u65E9\u304F\u6226\u529B\u306B\u306A\u308A\u307E\u3059\u3002",aEn:"No hotel experience, but at the busy Umeda store I handled tax-free service and directions for foreign customers \u2014 experience that connects directly to hotel work."},{q:"\u65E5\u672C\u8A9E\u306F\u3069\u306E\u304F\u3089\u3044\u8A71\u305B\u307E\u3059\u304B\u3002",qEn:"How is your Japanese?",a:"\u65E5\u672C\u306E\u5927\u5B66\u3092\u5352\u696D\u3057\u3066\u3001\u5352\u696D\u8AD6\u6587\u3082\u65E5\u672C\u8A9E\u3067\u66F8\u304D\u307E\u3057\u305F\u306E\u3067\u3001\u65E5\u5E38\u4F1A\u8A71\u306F\u554F\u984C\u3054\u3056\u3044\u307E\u305B\u3093\u3002\u4ECA\u306F\u3001\u30D5\u30ED\u30F3\u30C8\u306B\u3075\u3055\u308F\u3057\u3044\u656C\u8A9E\u3068\u30D3\u30B8\u30CD\u30B9\u65E5\u672C\u8A9E\u3092\u3001\u6BCE\u65E5\u52C9\u5F37\u3057\u3066\u78E8\u3044\u3066\u304A\u308A\u307E\u3059\u3002",aEn:"I graduated from a Japanese university and wrote my thesis in Japanese, so daily conversation is no problem. I'm now polishing front-desk keigo and business Japanese every day."},{q:"\u9577\u6240\u30 he guest out fully, confirm the facts. Apologize properly, offer a workable solution \u2014 and report to seniors immediately so the hotel responds as one team."},{q:"3\u5E74\u5F8C\u301C5\u5E74\u5F8C\u306E\u30AD\u30E3\u30EA\u30A2\u30D7\u30E9\u30F3\u3092\u6559\u3048\u3066\u304F\u3060\u3055\u3044\u3002",qEn:"Your 3\u20135 year career plan?",a:"\u307E\u305A\u306F\u30D5\u30ED\u30F3\u30C8\u306E\u4ED5\u4E8B\u3092\u5B8C\u74A7\u306B\u899A\u3048\u3066\u3001\u3069\u3093\u306A\u5834\u9762\u3067\u3082\u5BFE\u5FDC\u3067\u304D\u308B\u30B9\u30BF\u30C3\u30D5\u306B\u306A\u308A\u305F\u3044\u3067\u3059\u30023\u5E74\u304B\u30895\u5E74\u5F8C\u306B\u306F\u30013\u3064\u306E\u8A00\u8A9E\u3068\u73FE\u5834\u306E\u7D4C\u9A13\u3092\u6D3B\u304B\u3057\u3066\u3001\u30B7\u30D5\u30C8\u30EA\u30FC\u30C0\u30FC\u3084\u30D5\u30ED\u30F3\u30C8\u30DE\u30CD\u30FC\u30B8\u30E3\u30FC\u3068\u3057\u3066\u3001\u30C1\u30FC\u30E0\u3068\u6D77\u5916\u306E\u304A\u5BA2\u69D8\u306E\u6E80\u8DB3\u5EA6\u3092\u652F\u3048\u308B\u7ACB\u5834\u3092\u76EE\u6307\u3057\u305F\u3044\u3067\u3059\u3002",aEn:"First, master front desk work completely. In 3\u20135 years, use my three languages and floor experience as a shift leader or front manager supporting the team and international guests."},{q:"\u5B66\u751F\u6642\u4EE3\u306B\u6700\u3082\u529B\u3092\u5165\u308C\u305F\u3053\u3068\u306F\u4F55\u3067\u3059\u304B\u3002",qEn:"What did you put the most effort into as a student? (your resume story)",a:"\u5927\u5B66\u306E\u56FD\u969B\u4EA4\u6D41\u65BD\u8A2D\u300Ci-Chat\u300D\u3067\u306E\u6D3B\u52D5\u3067\u3059\u3002\u65E5\u672C\u4EBA\u5B66\u751F\u306E\u82F1\u8A9E\u306E\u4F1A\u8A71\u30D1\u30FC\u30C8\u30CA\u30FC\u3084\u3001\u7559\u5B66\u751F\u3078\u306E\u30AD\u30E3\u30F3\u30D1\u30B9\u6848\u5185\u3092\u3057\u307E\u3057\u305F\u3002\u82F1\u8A9E\u306B\u7DCA\u5F35\u3057\u3066\u3044\u308B\u5B66\u751F\u304C\u591A\u304B\u3063\u305F\u306E\u3067\u3001\u76F8\u624B\u306E\u30EC\u30D9\u30EB\u306B\u5408\u308F\u305B\u3066\u3001\u7B11\u9854\u3067\u8A71\u3057\u3
