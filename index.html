<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4EFE4">
<title>ことば · คำศัพท์ · English A1–A2</title>
<style>
/* ─────────────────────────────────────────────
   KOTOBA — three-script vocabulary trainer
   Palette: indigo (藍 / คราม) — the dye shared by
   Japanese aizome and Thai mo hom — on oat paper,
   with brass for progress.
   Type: old-style Latin serif + Japanese mincho +
   looped Thai sans, each at its own optical size.
   ───────────────────────────────────────────── */

:root{
  --paper:#F4EFE4;
  --card:#FFFCF6;
  --ink:#241E17;
  --ink2:#6E6255;
  --ink3:#9C9083;
  --rule:#DFD6C5;
  --indigo:#2C5470;
  --indigo-soft:#E4EAEF;
  --brass:#A67C2E;
  --rust:#A9452F;
  --ochre:#AC7B26;
  --moss:#3E6B4F;
  --hl:rgba(166,124,46,.30);
  --shadow:0 1px 2px rgba(36,30,23,.05), 0 8px 24px -12px rgba(36,30,23,.22);
  --r:22px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --jp:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
  --th:"Thonburi","Noto Sans Thai","Leelawadee UI",Sarabun,"Tahoma",sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,"Hiragino Sans","Noto Sans Thai","Leelawadee UI",sans-serif;
}
html[data-theme="night"]{
  --paper:#16120E;
  --card:#211B15;
  --ink:#F1EADC;
  --ink2:#A29684;
  --ink3:#6E6355;
  --rule:#332B23;
  --indigo:#89B4D0;
  --indigo-soft:#242E36;
  --brass:#C7A155;
  --rust:#CC6B52;
  --ochre:#C79A3E;
  --moss:#6E9C7C;
  --hl:rgba(199,161,85,.30);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--ui);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.jp{font-family:var(--jp)}
.th{font-family:var(--th)}

.app{
  max-width:520px;margin:0 auto;min-height:100%;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 18px calc(76px + env(safe-area-inset-bottom));
}

/* ── header ─────────────────────────── */
header{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:18px 2px 12px;
}
.brand{font-family:var(--jp);font-size:1.15rem;letter-spacing:.14em;color:var(--ink)}
.brand em{font-style:normal;font-family:var(--th);font-size:.9rem;color:var(--ink3);letter-spacing:0;margin-left:8px}
.langpick{display:flex;gap:0;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.langpick button{padding:5px 11px;font-size:.72rem;color:var(--ink3);letter-spacing:.04em}
.langpick button.on{background:var(--indigo);color:#FFFCF6}

/* ── today strip ────────────────────── */
.today{margin-bottom:18px}
.track{height:3px;background:var(--rule);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--brass);border-radius:999px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.tallies{display:flex;gap:16px;margin-top:9px;align-items:baseline}
.tally{display:flex;align-items:baseline;gap:5px;font-size:.74rem;color:var(--ink3);letter-spacing:.02em}
.tally b{font-family:var(--serif);font-size:1.02rem;font-weight:600;letter-spacing:0}
.tally.k-new b{color:var(--indigo)}
.tally.k-lrn b{color:var(--ochre)}
.tally.k-due b{color:var(--ink)}
.tally.streak{margin-left:auto;color:var(--brass)}
.tally.streak b{color:var(--brass)}

/* ── card ───────────────────────────── */
.stage{flex:1;display:flex;flex-direction:column;min-height:0}
.card{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--shadow);padding:26px 22px 22px;position:relative;
  min-height:min(52vh,380px);display:flex;flex-direction:column;
}
.meta{display:flex;gap:7px;align-items:center;margin-bottom:auto}
.chip{
  font-size:.63rem;letter-spacing:.06em;
  padding:3px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--ink3);
}
.chip.lv{border-color:var(--indigo);color:var(--indigo)}
.meta .spk{margin-left:auto;width:34px;height:34px;border-radius:999px;border:1px solid var(--rule);display:grid;place-items:center;color:var(--indigo)}
.meta .spk:active{background:var(--indigo-soft)}
.meta .spk svg{width:16px;height:16px;fill:currentColor}

.headword{
  font-family:var(--serif);font-weight:600;line-height:1.05;
  font-size:clamp(2.1rem,10vw,3.1rem);letter-spacing:-.015em;
  text-align:center;padding:14px 0 4px;word-break:break-word;
  transition:font-size .32s cubic-bezier(.2,.7,.3,1), padding .32s cubic-bezier(.2,.7,.3,1);
}
.card.open .headword{font-size:clamp(1.5rem,6.6vw,2rem);padding:4px 0 2px}
.headword.ask-jp{font-family:var(--jp);letter-spacing:.02em}
.headword.ask-th{font-family:var(--th);line-height:1.35}

.hint{text-align:center;font-size:.76rem;color:var(--ink3);margin-top:auto;padding-top:16px}
.card.open .hint{display:none}

/* the three-script unfold — the signature moment */
.reveal{margin-top:14px;display:none}
.card.open .reveal{display:block}
.line{
  display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:baseline;
  padding:11px 0;border-top:1px solid var(--rule);
  opacity:0;transform:translateY(7px);
  animation:unfold .34s cubic-bezier(.2,.7,.3,1) forwards;
}
.line:nth-child(1){animation-delay:.02s}
.line:nth-child(2){animation-delay:.10s}
.line:nth-child(3){animation-delay:.18s}
.exbox{
  margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);
  opacity:0;transform:translateY(7px);
  animation:unfold .34s cubic-bezier(.2,.7,.3,1) .26s forwards;
}
@keyframes unfold{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .line,.exbox{animation-duration:.001s}
  .headword{transition:none}
}
.lbl{font-size:.6rem;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;padding-top:5px}
.lbl.jp,.lbl.th{text-transform:none;letter-spacing:.04em;font-size:.66rem}
.val{font-size:1.5rem;line-height:1.5;display:block}
.val.jp{font-size:1.55rem}
.val.th{font-size:1.42rem;line-height:1.7}
.rom{display:block;font-size:.76rem;color:var(--ink3);letter-spacing:.02em;margin-top:1px}
.def{display:block;font-family:var(--serif);font-size:.95rem;line-height:1.5;color:var(--ink2)}
mark{background:linear-gradient(transparent 56%,var(--hl) 56%);color:inherit;font-weight:600;padding:0 1px;border-radius:2px}
.stars{font-size:.7rem;letter-spacing:1.5px;color:var(--rule);white-space:nowrap;flex-shrink:0}
.stars i{font-style:normal}
.stars i.on{color:var(--brass)}
.exbox p{margin:0 0 5px;font-size:.9rem;line-height:1.55;color:var(--ink2)}
.exbox p.en{font-family:var(--serif);font-size:.98rem;color:var(--ink)}
.exbox p.jp{font-size:.93rem;line-height:1.65}
.exbox p.th{font-size:.9rem;line-height:1.8}

/* ── rating ─────────────────────────── */
.showbar{margin-top:14px}
.btn{
  width:100%;padding:15px;border-radius:999px;background:var(--indigo);color:#FFFCF6;
  font-size:.95rem;letter-spacing:.03em;transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(.985)}
.rate{display:none;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
.card-answered .rate,.rate.on{display:grid}
.rate.two{grid-template-columns:repeat(2,1fr);gap:10px}
.rate.two .r1,.rate.two .r3{display:none}
.rate.two button{padding:14px 4px 12px}
.rate.two .nm{font-size:.9rem}
.rate button{
  padding:11px 4px 9px;border-radius:16px;border:1px solid;background:transparent;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:transform .12s ease;
}
.rate button:active{transform:scale(.96)}
.rate .nm{font-size:.78rem;letter-spacing:.01em}
.rate .iv{font-size:.62rem;color:var(--ink3);letter-spacing:.02em}
.r0{border-color:var(--rust);color:var(--rust)}
.r1{border-color:var(--ochre);color:var(--ochre)}
.r2{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-soft)}
.r3{border-color:var(--moss);color:var(--moss)}

.under{display:flex;gap:18px;justify-content:center;margin-top:14px}
.under button{font-size:.75rem;color:var(--ink3);letter-spacing:.02em;padding:6px 2px}
.under button:disabled{opacity:.35}

/* ── done state ─────────────────────── */
.done{text-align:center;padding:34px 8px}
.done .mark{font-family:var(--jp);font-size:2.4rem;color:var(--brass);line-height:1}
.done h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:14px 0 6px}
.done p{font-size:.86rem;color:var(--ink2);line-height:1.6}
.done .btn{margin-top:20px;background:transparent;color:var(--indigo);border:1px solid var(--indigo)}

/* ── views ──────────────────────────── */
.view{display:none;animation:fadein .18s ease}
.view.on{display:block}
@keyframes fadein{from{opacity:0}to{opacity:1}}
h2.vt{font-family:var(--serif);font-size:1.2rem;font-weight:600;margin:4px 0 14px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:4px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--rule)}
.row:first-child{border-top:none}
.row .k{font-size:.86rem}
.row .d{font-size:.72rem;color:var(--ink3);margin-top:2px;line-height:1.45}
.row .v{font-family:var(--serif);font-size:1.05rem;color:var(--indigo);white-space:nowrap}
.seg{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;flex-shrink:0}
.seg button{padding:6px 12px;font-size:.74rem;color:var(--ink3)}
.seg button.on{background:var(--indigo);color:#FFFCF6}
.stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--rule);border-radius:999px;overflow:hidden;flex-shrink:0}
.stepper button{width:34px;height:32px;color:var(--indigo);font-size:1.05rem}
.stepper span{font-family:var(--serif);min-width:34px;text-align:center;font-size:.95rem}
.linkbtn{color:var(--indigo);font-size:.86rem;text-align:left;padding:13px 0;border-top:1px solid var(--rule);width:100%}
.linkbtn.warn{color:var(--rust)}

/* words browser */
.search{width:100%;padding:12px 15px;border-radius:999px;border:1px solid var(--rule);background:var(--card);margin-bottom:10px;font-size:.9rem}
.search:focus{outline:2px solid var(--indigo);outline-offset:1px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.filters button{white-space:nowrap;padding:6px 13px;border-radius:999px;border:1px solid var(--rule);font-size:.74rem;color:var(--ink2)}
.filters button.on{background:var(--indigo);border-color:var(--indigo);color:#FFFCF6}
.wlist{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.witem{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--rule);width:100%;text-align:left}
.witem:first-child{border-top:none}
.dot{width:7px;height:7px;border-radius:999px;flex-shrink:0;background:var(--rule)}
.dot.s1{background:var(--ochre)}
.dot.s2{background:var(--indigo)}
.dot.s3{background:var(--moss)}
.witem .w{flex:1;min-width:0}
.witem .we{font-family:var(--serif);font-size:1rem}
.witem .wt{font-size:.78rem;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.witem .wi{font-size:.68rem;color:var(--ink3);letter-spacing:.04em}
.more{width:100%;padding:14px;font-size:.8rem;color:var(--indigo);border-top:1px solid var(--rule)}
.empty{text-align:center;padding:34px 16px;color:var(--ink3);font-size:.85rem;line-height:1.6}

/* stats */
.bigrow{display:flex;gap:10px;margin-bottom:14px}
.big{flex:1;background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:15px 12px;text-align:center;box-shadow:var(--shadow)}
.big b{display:block;font-family:var(--serif);font-size:1.6rem;font-weight:600;line-height:1.1}
.big span{display:block;font-size:.68rem;color:var(--ink3);margin-top:4px;letter-spacing:.03em}
.bars{display:flex;align-items:flex-end;gap:4px;height:96px;padding:0 2px}
.bars div{flex:1;background:var(--indigo-soft);border-radius:6px 6px 3px 3px;position:relative;min-height:3px}
.bars div i{position:absolute;inset:auto 0 0 0;background:var(--indigo);border-radius:6px 6px 3px 3px;display:block}
.barlbl{display:flex;gap:4px;margin-top:7px;padding:0 2px}
.barlbl span{flex:1;text-align:center;font-size:.6rem;color:var(--ink3)}
.mastery{display:flex;height:9px;border-radius:999px;overflow:hidden;margin:6px 0 8px;background:var(--rule)}
.mastery i{display:block;height:100%}
.mkey{display:flex;flex-wrap:wrap;gap:12px;font-size:.7rem;color:var(--ink3)}
.mkey span{display:flex;align-items:center;gap:5px}
.mkey em{width:7px;height:7px;border-radius:999px;font-style:normal}

/* nav */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--paper);background:color-mix(in srgb,var(--paper) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
}
.navin{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;padding:13px 4px 12px;font-size:.72rem;color:var(--ink3);letter-spacing:.03em;position:relative}
nav button.on{color:var(--indigo)}
nav button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2px;background:var(--indigo);border-radius:999px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;
  font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:8px}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">ことば<em>คำศัพท์</em></div>
    <div class="langpick" id="langpick">
      <button data-l="th">ไทย</button><button data-l="ja">日本語</button><button data-l="en">EN</button>
    </div>
  </header>

  <div class="today">
    <div class="track"><i id="trackFill"></i></div>
    <div class="tallies">
      <span class="tally k-new"><b id="cNew">0</b><span data-t="newLbl"></span></span>
      <span class="tally k-lrn"><b id="cLrn">0</b><span data-t="lrnLbl"></span></span>
      <span class="tally k-due"><b id="cDue">0</b><span data-t="dueLbl"></span></span>
      <span class="tally streak"><b id="cStreak">0</b><span data-t="streakLbl"></span></span>
    </div>
  </div>

  <!-- ══ STUDY ══ -->
  <section class="view on stage" id="v-study">
    <div id="studyWrap">
      <div class="card" id="card">
        <div class="meta">
          <span class="chip lv" id="chLv">A1</span>
          <span class="chip" id="chPos">noun</span>
          <span id="chStars"></span>
          <button class="spk" id="spkBtn" aria-label="Play audio">
            <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 2.2v2.1a7.5 7.5 0 010 15.4v2.1a9.6 9.6 0 000-19.6z"/></svg>
          </button>
        </div>
        <div class="headword" id="headword">—</div>
        <div class="reveal" id="reveal">
          <div class="line">
            <span class="lbl jp">日本語</span>
            <span><span class="val jp" id="rvJ"></span><span class="rom" id="rvJr"></span></span>
          </div>
          <div class="line">
            <span class="lbl th">ไทย</span>
            <span><span class="val th" id="rvT"></span><span class="rom" id="rvTr"></span></span>
          </div>
          <div class="exbox">
            <p class="en" id="exE"></p>
            <p class="jp" id="exJ"></p>
            <p class="th" id="exT"></p>
          </div>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <div class="showbar" id="showbar">
        <button class="btn" id="showBtn" data-t="show"></button>
      </div>
      <div class="rate" id="rate">
        <button class="r0" data-r="0"><span class="nm" data-t="again"></span><span class="iv" id="iv0"></span></button>
        <button class="r1" data-r="1"><span class="nm" data-t="hard"></span><span class="iv" id="iv1"></span></button>
        <button class="r2" data-r="2"><span class="nm" data-t="good"></span><span class="iv" id="iv2"></span></button>
        <button class="r3" data-r="3"><span class="nm" data-t="easy"></span><span class="iv" id="iv3"></span></button>
      </div>
      <div class="under">
        <button id="undoBtn" data-t="undo" disabled></button>
        <button id="skipBtn" data-t="skip"></button>
      </div>
    </div>

    <div class="done" id="doneBox" style="display:none">
      <div class="mark">完</div>
      <h2 data-t="doneTitle"></h2>
      <p id="doneMsg"></p>
      <button class="btn" id="extraBtn" data-t="studyMore"></button>
    </div>
  </section>

  <!-- ══ WORDS ══ -->
  <section class="view" id="v-words">
    <h2 class="vt" data-t="navWords"></h2>
    <input class="search" id="search" type="search" autocomplete="off" spellcheck="false">
    <div class="filters" id="filters"></div>
    <div class="wlist" id="wlist"></div>
  </section>

  <!-- ══ PROGRESS ══ -->
  <section class="view" id="v-stats">
    <h2 class="vt" data-t="navStats"></h2>
    <div class="bigrow">
      <div class="big"><b id="sKnown">0</b><span data-t="sKnownLbl"></span></div>
      <div class="big"><b id="sStreak">0</b><span data-t="sStreakLbl"></span></div>
      <div class="big"><b id="sTotal">0</b><span data-t="sTotalLbl"></span></div>
    </div>
    <div class="panel" style="padding:16px">
      <div class="k" style="font-size:.86rem;margin-bottom:4px" data-t="masteryTitle"></div>
      <div class="mastery" id="mastery"></div>
      <div class="mkey" id="mkey"></div>
    </div>
    <div class="panel" style="padding:16px">
      <div class="k" style="font-size:.86rem;margin-bottom:12px" data-t="last14"></div>
      <div class="bars" id="bars"></div>
      <div class="barlbl" id="barlbl"></div>
    </div>
  </section>

  <!-- ══ SETTINGS ══ -->
  <section class="view" id="v-set">
    <h2 class="vt" data-t="navSet"></h2>

    <div class="panel">
      <div class="row">
        <div><div class="k" data-t="setLevel"></div><div class="d" data-t="setLevelD"></div></div>
        <div class="seg" id="segLevel">
          <button data-v="1">A1</button><button data-v="2">A2</button><button data-v="0">A1+A2</button>
        </div>
      </div>
      <div class="row">
        <div><div class="k" data-t="setBtn"></div><div class="d" data-t="setBtnD"></div></div>
        <div class="seg" id="segBtn"><button data-v="2">2</button><button data-v="4">4</button></div>
      </div>
      <div class="row">
        <div><div class="k" data-t="setDir"></div><div class="d" data-t="setDirD"></div></div>
        <div class="seg" id="segDir">
          <button data-v="en">EN→</button><button data-v="na">→EN</button><button data-v="mix" data-t="mix"></button>
        </div>
      </div>
      <div class="row">
        <div><div class="k" data-t="setNew"></div><div class="d" data-t="setNewD"></div></div>

function save(){DB.set(KEY,JSON.stringify(S))}

/* ── Time: the day flips at 4am, like Anki ──────────────── */
const MIN=60000, DAY=86400000;
function dayKey(ts){const d=new Date(ts-4*3600000);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return dayKey(Date.now())}
function todayLog(){const k=today();if(!S.log[k])S.log[k]={n:0,r:0};return S.log[k]}
function streak(){
  let n=0,t=Date.now();
  if(!S.log[dayKey(t)]||!S.log[dayKey(t)].r)t-=DAY;
  while(S.log[dayKey(t)]&&S.log[dayKey(t)].r>0){n++;t-=DAY}
  return n;
}
function fmt(ms){
  if(ms<DAY)return Math.max(1,Math.round(ms/MIN))+" "+L.u.m;
  const d=Math.round(ms/DAY);
  if(d<30)return d+" "+L.u.d;
  return Math.round(d/30)+" "+L.u.mo;
}

/* ── Cards ──────────────────────────────────────────────── */
// s: 0 new · 1 learning · 2 review · 3 relearning
const STEPS=[1,10], RESTEPS=[10];
function card(id){
  if(!S.cards[id])S.cards[id]={s:0,st:0,ivl:0,ef:2.5,due:0,reps:0,lap:0};
  return S.cards[id];
}
function has(id){return !!S.cards[id]}
function inLevel(w){return S.lv===0||w.l===S.lv}

/* Pure scheduler. r: 0 again · 1 hard · 2 good · 3 easy */
function project(c,r,now){
  let {s,st,ivl,ef,lap}=c, due;
  if(s===0||s===1){
    if(r===0){st=0;s=1;due=now+STEPS[0]*MIN}
    else if(r===1){s=1;due=now+STEPS[Math.min(st,STEPS.length-1)]*MIN}
    else if(r===2){
      st=st+1;
      if(st>=STEPS.length){s=2;ivl=1;due=now+DAY}
      else{s=1;due=now+STEPS[st]*MIN}
    }
    else{s=2;ivl=4;due=now+4*DAY}
  }else if(s===2){
    if(r===0){lap++;ef=Math.max(1.3,ef-0.2);ivl=Math.max(1,Math.round(ivl*0.5));s=3;st=0;due=now+RESTEPS[0]*MIN}
    else if(r===1){ef=Math.max(1.3,ef-0.15);ivl=Math.min(365,Math.max(ivl+1,Math.round(ivl*1.2)));due=now+ivl*DAY}
    else if(r===2){
      if(lap>0&&ivl>=21)ef=Math.min(2.5,ef+0.05); // slow recovery so a lapsed word isn't stuck forever
      ivl=Math.min(365,Math.max(ivl+1,Math.round(ivl*ef)));due=now+ivl*DAY;
    }
    else{ef=Math.min(2.8,ef+0.15);ivl=Math.min(365,Math.max(ivl+2,Math.round(ivl*ef*1.3)));due=now+ivl*DAY}
  }else{
    if(r<=1){due=now+RESTEPS[0]*MIN}
    else{s=2;ivl=Math.max(1,ivl);due=now+ivl*DAY}
  }
  return {s,st,ivl,ef,lap,due};
}

/* ── How well he knows a word: 0–5, from the real interval ─ */
function strength(id){
  if(!has(id))return 0;
  const c=S.cards[id];
  if(c.s!==2)return 1;
  if(c.ivl<7)return 2;
  if(c.ivl<21)return 3;
  if(c.ivl<60)return 4;
  return 5;
}
function bucket(n){return n===0?0:n<=2?1:n<=4?2:3}
function starsHTML(n){
  let h='<span class="stars">';
  for(let i=1;i<=5;i++)h+='<i class="'+(i<=n?"on":"")+'">★</i>';
  return h+"</span>";
}

/* ── Queue ──────────────────────────────────────────────── */
function pools(){
  const now=Date.now(), lg=todayLog();
  const lrn=[],rev=[],nw=[];
  for(const w of WORDS){
    if(!inLevel(w)||skipSet.has(w.i))continue;
    if(!has(w.i)){nw.push(w);continue}
    const c=S.cards[w.i];
    if(c.s===1||c.s===3){lrn.push(w)}
    else if(c.s===2&&c.due<=now){rev.push(w)}
  }
  lrn.sort((a,b)=>S.cards[a.i].due-S.cards[b.i].due);
  rev.sort((a,b)=>S.cards[a.i].due-S.cards[b.i].due);
  const newLeft=Math.max(0,S.nw+(S.extraDay===today()?S.extra:0)-lg.n);
  const revLeft=Math.max(0,S.mx-lg.r);
  return {lrn,rev:rev.slice(0,revLeft),nw:nw.slice(0,newLeft),allNew:nw};
}
function pick(){
  const p=pools(), now=Date.now();
  const dueLrn=p.lrn.filter(w=>S.cards[w.i].due<=now);
  if(dueLrn.length)return dueLrn[0];
  if(p.nw.length&&(p.rev.length===0||mixCount%3===2))return p.nw[0];
  if(p.rev.length)return p.rev[0];
  if(p.nw.length)return p.nw[0];
  if(p.lrn.length)return p.lrn[0];      // learn ahead
  return null;
}

/* ── Highlighting the target word inside its sentence ───── */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
const IRREG={lend:"lent",tooth:"teeth",win:"won",cancel:"cancelled",foot:"feet",man:"men",woman:"women",child:"children",
 go:"went|gone|goes",buy:"bought",take:"took|taken",give:"gave|given",make:"made",find:"found",get:"got",tell:"told",
 say:"said",see:"saw|seen",eat:"ate|eaten",drink:"drank|drunk",sleep:"slept",run:"ran",sit:"sat",stand:"stood",
 leave:"left",lose:"lost",bring:"brought",send:"sent",write:"wrote|written",know:"knew|known",think:"thought",
 understand:"understood",forget:"forgot|forgotten",choose:"chose|chosen",pay:"paid",meet:"met",wear:"wore|worn",
 drive:"drove|driven",come:"came",have:"had|has",speak:"spoke|spoken",become:"became",build:"built",hide:"hid|hidden",steal:"stole|stolen"};
function mark(sentence,word){
  const w=word.trim();
  const q=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const pats=[q(w)+"(s|es|ed|d|ing|ly|er|est)?"];
  if(w.length>3&&/e$/i.test(w))pats.push(q(w.slice(0,-1))+"(ing|ed|es)");
  if(w.length>3&&/y$/i.test(w))pats.push(q(w.slice(0,-1))+"(ies|ied|ying)");
  if(IRREG[w.toLowerCase()])pats.push(IRREG[w.toLowerCase()]);
  if(/^[a-z]{3,5}$/i.test(w)&&/[bdgklmnprt]$/i.test(w))pats.push(q(w+w.slice(-1))+"(ed|ing)");
  let m=null;
  try{m=sentence.match(new RegExp("\\b("+pats.join("|")+")\\b","i"))}catch(e){}
  if(!m)return esc(sentence);
  return esc(sentence.slice(0,m.index))+"<mark>"+esc(m[0])+"</mark>"+esc(sentence.slice(m.index+m[0].length));
}

/* ── Study view ─────────────────────────────────────────── */
const $=id=>document.getElementById(id);
function askEnglish(w){
  if(S.dir==="en")return true;
  if(S.dir==="na")return false;
  return (w.i%2)===0;
}
function render(){
  const p=pools(), lg=todayLog();
  $("cNew").textContent=p.nw.length;
  $("cLrn").textContent=p.lrn.length;
  $("cDue").textContent=p.rev.length;
  $("cStreak").textContent=streak();
  const target=Math.max(1,lg.r+p.lrn.length+p.rev.length+p.nw.length);
  $("trackFill").style.width=Math.round(lg.r/target*100)+"%";

  cur=pick(); shown=false;
  $("card").classList.remove("open");
  $("rate").classList.remove("on");
  $("rate").classList.toggle("two",S.btn===2);
  $("showbar").style.display="";
  $("undoBtn").disabled=!undoSnap;

  if(!cur){
    $("studyWrap").style.display="none";
    $("doneBox").style.display="";
    let msg=L.doneMsg(lg.r);
    const up=WORDS.filter(w=>inLevel(w)&&has(w.i)&&S.cards[w.i].s===2).map(w=>S.cards[w.i].due).sort((a,b)=>a-b)[0];
    if(up&&up>Date.now())msg+=" · "+L.nextDue(fmt(up-Date.now()));
    $("doneMsg").textContent=msg;
    $("extraBtn").style.display=p.allNew.length?"":"none";
    return;
  }
  $("studyWrap").style.display="";
  $("doneBox").style.display="none";

  const w=cur, en=askEnglish(w);
  $("chLv").textContent="A"+w.l;
  $("chPos").textContent=L.pos[w.p]||w.p;
  $("chStars").innerHTML=starsHTML(strength(w.i));
  $("hint").textContent=L.tap;

  const hw=$("headword");
  hw.className="headword";
  if(en){hw.textContent=w.e}
  else{
    hw.innerHTML='<span class="jp" style="display:block">'+w.j+'</span>'+
      '<span class="th" style="display:block;font-size:.62em;margin-top:8px;color:var(--ink2)">'+w.t+'</span>';
  }
  $("reveal").innerHTML="";
  if(S.audio&&en)speak(w.e);
}

function reveal(){
  if(!cur||shown)return;
  shown=true;
  const w=cur, en=askEnglish(w), rom=S.rom;
  let h="";
  if(en){
    h+=line("日本語","jp",w.j,rom?w.jr:"");
    h+=line("ไทย","th",w.t,rom?w.tr:"");
  }else{
    h+='<div class="line"><span class="lbl">English</span><span><span class="val" style="font-family:var(--serif)">'+w.e+'</span>'+
       (rom?'<span class="rom">'+w.jr+' · '+w.tr+'</span>':'')+'</span></div>';
  }
  if(w.d)h+='<div class="line"><span class="lbl">'+L.mean+'</span><span><span class="def">'+esc(w.d)+'</span></span></div>';
  h+='<div class="exbox"><p class="en">'+mark(w.xe,w.e.replace(/\s*\(.*\)/,""))+'</p><p class="jp">'+esc(w.xj)+'</p><p class="th">'+esc(w.xt)+'</p></div>';
  $("reveal").innerHTML=h;
  $("card").classList.add("open");
  $("showbar").style.display="none";
  $("rate").classList.add("on");

  const c=card(w.i), now=Date.now();
  for(let r=0;r<4;r++){
    const n=project(c,r,now);
    $("iv"+r).textContent=fmt(n.due-now);
  }
  if(S.audio&&!en)speak(w.e);
}
function line(label,cls,val,rom){
  return '<div class="line"><span class="lbl '+cls+'">'+label+'</span><span><span class="val '+cls+'">'+val+
    '</span>'+(rom?'<span class="rom">'+rom+'</span>':'')+'</span></div>';
}

function answer(r){
  if(!cur||!shown)return;
  const id=cur.i, now=Date.now();
  const wasNew=!has(id);
  const c=card(id);
  undoSnap={id,prev:Object.assign({},c),wasNew,day:today(),log:Object.assign({},todayLog())};
  Object.assign(c,project(c,r,now));
  c.reps++;
  const lg=todayLog();
  if(wasNew)lg.n++;
  lg.r++;
  mixCount++;
  save();render();
}
function undo(){
  if(!undoSnap)return;
  const u=undoSnap;
  if(u.wasNew)delete S.cards[u.id]; else S.cards[u.id]=u.prev;
  S.log[u.day]=u.log;
  undoSnap=null;
  save();render();toast(L.undone);
}
function skip(){
  if(!cur)return;
  skipSet.add(cur.i);
  if(skipSet.size>=8)skipSet.clear();
  render();
}

/* ── Audio ──────────────────────────────────────────────── */
let voice=null;
function pickVoice(){
  try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}
}
function speak(t){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t).replace(/\s*\(.*\)/,""));
    u.lang="en-US";u.rate=.85;if(voice)u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ── Words browser ──────────────────────────────────────── */
let wq="", wf="all", wLimit=60;
function buildFilters(){
  const cats=[...new Set(WORDS.map(w=>w.c))];
  let h='<button data-f="all" class="'+(wf==="all"?"on":"")+'">'+L.all+'</button>';
  h+='<button data-f="weak" class="'+(wf==="weak"?"on":"")+'">'+L.weak+'</button>';
  h+='<button data-f="A1" class="'+(wf==="A1"?"on":"")+'">A1</button>';
  h+='<button data-f="A2" class="'+(wf==="A2"?"on":"")+'">A2</button>';
  for(const c of cats)h+='<button data-f="'+c+'" class="'+(wf===c?"on":"")+'">'+(L.cat[c]||c)+'</button>';
  $("filters").innerHTML=h;
}
function renderWords(){
  buildFilters();
  const q=wq.trim().toLowerCase();
  const list=WORDS.filter(w=>{
    if(wf==="A1"&&w.l!==1)return false;
    if(wf==="A2"&&w.l!==2)return false;
    if(wf==="weak"){const s=strength(w.i);if(!(s>=1&&s<=2))return false}
    else if(wf!=="all"&&wf!=="A1"&&wf!=="A2"&&w.c!==wf)return false;
    if(!q)return true;
    return w.e.toLowerCase().includes(q)||w.j.includes(wq)||w.t.includes(wq)||w.jr.toLowerCase().includes(q)||w.tr.toLowerCase().includes(q);
  });
  if(!list.length){$("wlist").innerHTML='<div class="empty">'+L.noResult+'</div>';return}
  let h="";
  for(const w of list.slice(0,wLimit)){
    h+='<div class="witem"><span class="w">'+
      '<span class="we">'+w.e+' <span class="wi">A'+w.l+'</span></span>'+
      '<span class="wt"><span class="jp">'+w.j+'</span> · <span class="th">'+w.t+'</span></span></span>'+
      starsHTML(strength(w.i))+'</div>';
  }
  if(list.length>wLimit)h+='<button class="more" id="moreBtn">'+L.more+' ('+(list.length-wLimit)+')</button>';
  $("wlist").innerHTML=h;
  const mb=$("moreBtn");if(mb)mb.onclick=()=>{wLimit+=60;renderWords()};
}

/* ── Progress ───────────────────────────────────────────── */
function renderStats(){
  const pool=WORDS.filter(inLevel);
  const b=[0,0,0,0];
  for(const w of pool)b[bucket(strength(w.i))]++;
  $("sKnown").textContent=b[2]+b[3];
  $("sStreak").textContent=streak();
  $("sTotal").textContent=pool.length;
  const tot=Math.max(1,pool.length);
  const cols=["var(--rule)","var(--ochre)","var(--indigo)","var(--moss)"];
  const names=[L.mNew,L.mLrn,L.mYng,L.mMat];
  $("mastery").innerHTML=b.map((v,i)=>'<i style="width:'+(v/tot*100)+'%;background:'+cols[i]+'"></i>').join("");
  $("mkey").innerHTML=b.map((v,i)=>'<span><em style="background:'+cols[i]+'"></em>'+names[i]+' '+v+'</span>').join("");

  const days=[],labels=[];
  for(let i=13;i>=0;i--){
    const t=Date.now()-i*DAY, k=dayKey(t);
    days.push(S.log[k]?S.log[k].r:0);
    labels.push(i%3===0?new Date(t).getDate():"");
  }
  const mx=Math.max(1,...days);
  $("bars").innerHTML=days.map(v=>'<div><i style="height:'+Math.round(v/mx*100)+'%"></i></div>').join("");
  $("barlbl").innerHTML=labels.map(v=>'<span>'+v+'</span>').join("");
}

/* ── Settings & chrome ──────────────────────────────────── */
function applyText(){
  L=I18N[S.lang];
  document.documentElement.lang=S.lang==="ja"?"ja":S.lang==="en"?"en":"th";
  document.querySelectorAll("[data-t]").forEach(el=>{const v=L[el.dataset.t];if(typeof v==="string")el.textContent=v});
  $("search").placeholder=L.search;
  document.querySelectorAll("#langpick button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.lang));
  seg("segLevel",String(S.lv));seg("segDir",S.dir);seg("segAudio",String(S.audio));
  seg("segRom",String(S.rom));seg("segTheme",S.theme);seg("segBtn",String(S.btn));
  $("newVal").textContent=S.nw;$("maxVal").textContent=S.mx;
  document.documentElement.dataset.theme=S.theme;
  document.querySelector('meta[name=theme-color]').content=S.theme==="night"?"#16120E":"#F4EFE4";
}
function seg(id,v){document.querySelectorAll("#"+id+" button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("on"),1900)}
function go(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("on"));
  $("v-"+v).classList.add("on");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="words")renderWords();
  if(v==="stats")renderStats();
  if(v==="study")render();
  window.scrollTo(0,0);
}

/* ── Backup ─────────────────────────────────────────────── */
function exportData(){
  const txt=JSON.stringify(S);
  const blob=new Blob([txt],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="kotoba-backup-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  try{navigator.clipboard.writeText(txt).then(()=>toast(L.saved+" · "+L.copied),()=>toast(L.saved))}catch(e){toast(L.saved)}
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||typeof o!=="object"||!("cards" in o))throw 0;
      S=Object.assign({},DEF,o,{cards:o.cards||{},log:o.log||{}});
      save();applyText();render();toast(L.imported);
    }catch(e){toast(L.badFile)}
  };
  r.readAsText(file);
}

/* ── Wiring ─────────────────────────────────────────────── */
$("card").addEventListener("click",reveal);
$("showBtn").addEventListener("click",reveal);
$("spkBtn").addEventListener("click",e=>{e.stopPropagation();if(cur)speak(cur.e)});
$("rate").addEventListener("click",e=>{const b=e.target.closest("button");if(b)answer(+b.dataset.r)});
$("undoBtn").addEventListener("click",undo);
$("skipBtn").addEventListener("click",skip);
$("extraBtn").addEventListener("click",()=>{
  if(S.extraDay!==today()){S.extraDay=today();S.extra=0}
  S.extra+=10;save();render();
});
document.querySelector(".navin").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)});
$("langpick").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.lang=b.dataset.l;save();applyText();render();renderWords()});
$("search").addEventListener("input",e=>{wq=e.target.value;wLimit=60;renderWords()});
$("filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;wf=b.dataset.f;wLimit=60;renderWords()});
$("segLevel").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.lv=+b.dataset.v;save();applyText();render()});
$("segBtn").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.btn=+b.dataset.v;save();applyText();$("rate").classList.toggle("two",S.btn===2)});
$("segDir").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.dir=b.dataset.v;save();applyText();render()});
$("segAudio").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.audio=+b.dataset.v;save();applyText()});
$("segRom").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.rom=+b.dataset.v;save();applyText()});
$("segTheme").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.theme=b.dataset.v;save();applyText()});
document.querySelectorAll(".stepper button").forEach(b=>b.addEventListener("click",()=>{
  const step=+b.dataset.s, isNew=b.parentElement.querySelector("span").id==="newVal";
  if(isNew)S.nw=Math.max(5,Math.min(60,S.nw+step)); else S.mx=Math.max(20,Math.min(400,S.mx+step));
  save();applyText();render();
}));
$("expBtn").addEventListener("click",exportData);
$("impBtn").addEventListener("click",()=>$("impFile").click());
$("impFile").addEventListener("change",e=>{if(e.target.files[0])importData(e.target.files[0])});
$("resetBtn").addEventListener("click",()=>{
  if(confirm(L.confirmReset)){DB.del(KEY);S=JSON.parse(JSON.stringify(DEF));undoSnap=null;save();applyText();render();renderWords()}
});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.code==="Space"||e.code==="Enter"){e.preventDefault();shown?answer(2):reveal();return}
  if(shown&&e.key>="1"&&e.key<="4"){
    const k=+e.key-1;
    answer(S.btn===2?(k===0?0:k===1?2:-1):k);
  }
  else if(e.key==="u")undo();
});
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}

applyText();
render();
</script>
