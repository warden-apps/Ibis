<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEFR A1 Vocabulary - SRS Learning System</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --again: #ef4444;
      --hard: #f59e0b;
      --good: #10b981;
      --easy: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 1.75rem; color: var(--accent); margin-bottom: 6px; }
    p.sub { color: var(--text-muted); font-size: 0.9rem; }

    .stats-bar {
      display: flex; gap: 12px; margin-bottom: 20px; width: 100%; max-width: 500px;
    }
    .stat-box {
      flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center;
    }
    .stat-box .val { font-size: 1.2rem; font-weight: bold; }
    .stat-box .lbl { font-size: 0.75rem; color: var(--text-muted); }

    .flashcard-container {
      width: 100%; max-width: 500px; height: 320px; perspective: 1000px; cursor: pointer; margin-bottom: 20px;
    }
    .flashcard {
      width: 100%; height: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px;
      position: relative; text-align: center; transition: transform 0.4s; transform-style: preserve-3d;
    }
    .flashcard.flipped { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
    }
    .card-back { transform: rotateY(180deg); }

    .pos-tag { position: absolute; top: 16px; right: 16px; background: #334155; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; color: var(--accent); }
    .word-en { font-size: 2.2rem; font-weight: bold; margin-bottom: 12px; }
    .audio-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 1.2rem; margin-bottom: 8px; }
    
    .trans-group { margin-top: 10px; width: 100%; }
    .trans-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #334155; font-size: 1.1rem; }
    .trans-label { color: var(--text-muted); font-size: 0.85rem; }

    .controls { display: flex; gap: 8px; width: 100%; max-width: 500px; }
    .btn {
      flex: 1; padding: 12px 6px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-again { background: var(--again); }
    .btn-hard { background: var(--hard); }
    .btn-good { background: var(--good); }
    .btn-easy { background: var(--easy); }

    .deck-info { margin-top: 30px; font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 12px; }
    .deck-info button { background: none; border: none; color: var(--accent); cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <h1>A1 English SRS Memory Engine</h1>
    <p class="sub">CEFR Elementary • Japanese & Thai Flashcards</p>
  </header>

  <div class="stats-bar">
    <div class="stat-box"><div class="val" id="count-due">0</div><div class="lbl">Due Now</div></div>
    <div class="stat-box"><div class="val" id="count-learning">0</div><div class="lbl">Learning</div></div>
    <div class="stat-box"><div class="val" id="count-mastered">0</div><div class="lbl">Mastered</div></div>
  </div>

  <div class="flashcard-container" onclick="flipCard()">
    <div class="flashcard" id="card">
      <div class="card-front">
        <span class="pos-tag" id="card-pos">noun</span>
        <div class="word-en" id="card-en">Loading...</div>
        <button class="audio-btn" onclick="speakCurrentWord(event)">🔊 Listen</button>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 20px;">Click card to reveal translation</p>
      </div>
      <div class="card-back">
        <div class="word-en" id="card-en-back">Word</div>
        <div class="trans-group">
          <div class="trans-row"><span class="trans-label">🇯🇵 Japanese:</span> <span id="card-jp">-</span></div>
          <div class="trans-row"><span class="trans-label">🇹🇭 Thai:</span> <span id="card-th">-</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-again" id="btn-0" onclick="answerCard(0)" disabled>Again<br><small>&lt;1m</small></button>
    <button class="btn btn-hard" id="btn-1" onclick="answerCard(1)" disabled>Hard<br><small>1d</small></button>
    <button class="btn btn-good" id="btn-2" onclick="answerCard(2)" disabled>Good<br><small>3d</small></button>
    <button class="btn btn-easy" id="btn-3" onclick="answerCard(3)" disabled>Easy<br><small>7d</small></button>
  </div>

  <div class="deck-info">
    <span id="total-words">Total words: 0</span>
    <button onclick="resetProgress()">Reset All Progress</button>
  </div>

  <script>
    const INITIAL_DECK = [
      { id: 1, en: "always", pos: "adv", jp: "常に (Tsuneni)", th: "เสมอ (Samae)" },
      { id: 2, en: "animal", pos: "n", jp: "動物 (Dōbutsu)", th: "สัตว์ (Sat)" },
      { id: 3, en: "apple", pos: "n", jp: "りんご (Ringo)", th: "แอปเปิ้ล (Aep-poen)" },
      { id: 4, en: "beautiful", pos: "adj", jp: "美しい (Utsukushii)", th: "สวย (Suai)" },
      { id: 5, en: "book", pos: "n", jp: "本 (Hon)", th: "หนังสือ (Nang-sue)" },
      { id: 6, en: "boy", pos: "n", jp: "男の子 (Otokonoko)", th: "เด็กผู้ชาย (Dek phu-chai)" },
      { id: 7, en: "bread", pos: "n", jp: "パン (Pan)", th: "ขนมปัง (Khanom-pang)" },
      { id: 8, en: "brother", pos: "n", jp: "兄弟/兄/弟 (Kyōdai)", th: "พี่ชาย/น้องชาย (Phi-chai)" },
      { id: 9, en: "buy", pos: "v", jp: "買う (Kau)", th: "ซื้อ (Sue)" },
      { id: 10, en: "car", pos: "n", jp: "車 (Kuruma)", th: "รถยนต์ (Rot-yon)" },
      { id: 11, en: "cat", pos: "n", jp: "猫 (Neko)", th: "แมว (Maelw)" },
      { id: 12, en: "city", pos: "n", jp: "都市 (Toshi)", th: "เมือง (Mueang)" },
      { id: 13, en: "cold", pos: "adj", jp: "寒い (Samui)", th: "หนาว (Nao)" },
      { id: 14, en: "day", pos: "n", jp: "日 (Hi)", th: "วัน (Wan)" },
      { id: 15, en: "drink", pos: "v", jp: "飲む (Nomu)", th: "ดื่ม (Duem)" },
      { id: 16, en: "eat", pos: "v", jp: "食べる (Taberu)", th: "กิน (Kin)" },
      { id: 17, en: "family", pos: "n", jp: "家族 (Kazoku)", th: "ครอบครัว (Khrop-khrua)" },
      { id: 18, en: "friend", pos: "n", jp: "友達 (Tomodachi)", th: "เพื่อน (Phuean)" },
      { id: 19, en: "girl", pos: "n", jp: "女の子 (Onnanoko)", th: "เด็กผู้หญิง (Dek phu-ying)" },
      { id: 20, en: "happy", pos: "adj", jp: "嬉しい (Ureshii)", th: "มีความสุข (Mee-khwam-suk)" },
      { id: 21, en: "house", pos: "n", jp: "家 (Ie)", th: "บ้าน (Ban)" },
      { id: 22, en: "language", pos: "n", jp: "言語 (Gengo)", th: "ภาษา (Pha-sa)" },
      { id: 23, en: "learn", pos: "v", jp: "学ぶ (Manabu)", th: "เรียนรู้ (Rian-ru)" },
      { id: 24, en: "money", pos: "n", jp: "お金 (Okane)", th: "เงิน (Ngoen)" },
      { id: 25, en: "mother", pos: "n", jp: "母 (Haha)", th: "แม่ (Mae)" },
      { id: 26, en: "school", pos: "n", jp: "学校 (Gakkō)", th: "โรงเรียน (Rong-rian)" },
      { id: 27, en: "today", pos: "n", jp: "今日 (Kyō)", th: "วันนี้ (Wan-nee)" },
      { id: 28, en: "water", pos: "n", jp: "水 (Mizu)", th: "น้ำ (Nam)" }
    ];

    let deck = [];
    let activeCard = null;
    let isFlipped = false;

    function initDeck() {
      const saved = localStorage.getItem("a1_srs_deck");
      if (saved) {
        deck = JSON.parse(saved);
      } else {
        deck = INITIAL_DECK.map(item => ({
          ...item,
          interval: 0,
          repetition: 0,
          efactor: 2.5,
          dueDate: Date.now()
        }));
        saveDeck();
      }
      updateStats();
      nextCard();
    }

    function saveDeck() {
      localStorage.setItem("a1_srs_deck", JSON.stringify(deck));
    }

    function updateStats() {
      const now = Date.now();
      const due = deck.filter(c => c.dueDate <= now).length;
      const learning = deck.filter(c => c.repetition > 0 && c.repetition < 3).length;
      const mastered = deck.filter(c => c.repetition >= 3).length;

      document.getElementById("count-due").innerText = due;
      document.getElementById("count-learning").innerText = learning;
      document.getElementById("count-mastered").innerText = mastered;
      document.getElementById("total-words").innerText = `Total words: ${deck.length}`;
    }

    function nextCard() {
      isFlipped = false;
      document.getElementById("card").classList.remove("flipped");
      toggleButtons(false);

      const now = Date.now();
      const dueCards = deck.filter(c => c.dueDate <= now);

      if (dueCards.length === 0) {
        document.getElementById("card-en").innerText = "🎉 All Done!";
        document.getElementById("card-pos").innerText = "-";
        activeCard = null;
        return;
      }

      activeCard = dueCards[Math.floor(Math.random() * dueCards.length)];
      
      document.getElementById("card-pos").innerText = activeCard.pos;
      document.getElementById("card-en").innerText = activeCard.en;
      document.getElementById("card-en-back").innerText = activeCard.en;
      document.getElementById("card-jp").innerText = activeCard.jp;
      document.getElementById("card-th").innerText = activeCard.th;
    }

    function flipCard() {
      if (!activeCard) return;
      isFlipped = !isFlipped;
      document.getElementById("card").classList.toggle("flipped", isFlipped);
      if (isFlipped) toggleButtons(true);
    }

    function toggleButtons(enabled) {
      [0, 1, 2, 3].forEach(rating => {
        document.getElementById(`btn-${rating}`).disabled = !enabled;
      });
    }

    // SuperMemo-2 Spaced Repetition Logic
    function answerCard(rating) {
      if (!activeCard) return;

      let { interval, repetition, efactor } = activeCard;

      if (rating >= 1) {
        if (repetition === 0) interval = 1;
        else if (repetition === 1) interval = 3;
        else interval = Math.round(interval * efactor);
        repetition++;
      } else {
        repetition = 0;
        interval = 0;
      }

      efactor = efactor + (0.1 - (3 - rating) * (0.08 + (3 - rating) * 0.02));
      if (efactor < 1.3) efactor = 1.3;

      // Calculate next due date (in days, or short delay for 'Again')
      const delayMs = rating === 0 ? 60 * 1000 : interval * 24 * 60 * 60 * 1000;
      activeCard.interval = interval;
      activeCard.repetition = repetition;
      activeCard.efactor = efactor;
      activeCard.dueDate = Date.now() + delayMs;

      saveDeck();
      updateStats();
      nextCard();
    }

    function speakCurrentWord(event) {
      event.stopPropagation();
      if (!activeCard) return;
      const utterance = new SpeechSynthesisUtterance(activeCard.en);
      utterance.lang = "en-US";
      window.speechSynthesis.speak(utterance);
    }

    function resetProgress() {
      if (confirm("Reset all learning progress for this deck?")) {
        localStorage.removeItem("a1_srs_deck");
        initDeck();
      }
    }

    window.onload = initDeck;
  </script>
</body>
</html>
